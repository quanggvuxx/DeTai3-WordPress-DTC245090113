services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - obs_net
      - admin_net
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run setup first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - obs_net
      - admin_net
    depends_on:
      - prometheus
    user: "472:472"
    security_opt:
      - no-new-privileges:true

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8082/stub_status
    networks:
      - obs_net
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true

  mysql_exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=metrics_user
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Run setup first}
    networks:
      - obs_net
      - db_net
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - obs_net
    security_opt:
      - no-new-privileges:true
    # Docker Desktop (Windows/WSL2) can limit some host/container metrics.

volumes:
  prometheus_data:
  grafana_data:
