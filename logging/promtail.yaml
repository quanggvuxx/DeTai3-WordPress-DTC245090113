server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: website_nginx_access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx-access
          service: nginx
          __path__: /var/log/site/access.log
  - job_name: website_nginx_error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx-error
          service: nginx
          __path__: /var/log/site/error.log
